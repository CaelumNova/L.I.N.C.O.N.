<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L.I.N.C.O.N.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  :root {
    --bg:#070000; --panel:#120202; --line:#5a0000; --red:#ff2a2a; --red2:#ff6b6b;
    --dim:#a33; --glow:0 0 14px rgba(255,0,0,.55);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, #2a0000 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,0,0,.035) 0 1px, transparent 1px 3px),
      var(--bg);
    color:var(--red2); font-family:'Share Tech Mono','Courier New',monospace;
    display:flex; flex-direction:column; align-items:center;
  }
  header { text-align:center; padding:22px 16px 10px; }
  .ring {
    width:70px; height:70px; margin:0 auto 12px; border-radius:50%;
    border:3px solid var(--red); box-shadow:var(--glow), inset 0 0 16px #800000;
    position:relative; animation:pulse 2.6s ease-in-out infinite;
  }
  .ring::after {
    content:""; position:absolute; inset:14px; border-radius:50%;
    border:2px dashed var(--red); animation:spin 9s linear infinite;
  }
  @keyframes pulse { 50% { box-shadow:0 0 34px #ff2a2a, inset 0 0 24px #b00000; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 {
    font-family:Orbitron,sans-serif; font-weight:800; margin:0; color:var(--red);
    letter-spacing:.5em; padding-left:.5em; font-size:clamp(1.4rem,5vw,2.3rem);
    text-shadow:0 0 8px #f00, 0 0 26px #a00000;
  }
  .sub { color:var(--dim); letter-spacing:.18em; font-size:.72rem; margin-top:6px; }
  #status { margin-top:8px; font-size:.75rem; color:var(--dim); }
  #status b { color:var(--red); }
  main {
    width:min(980px,100%); flex:1; min-height:0; display:flex; flex-direction:column;
    padding:0 14px 14px; gap:10px;
  }
  #log {
    flex:1; overflow-y:auto; border:1px solid var(--line); background:var(--panel);
    border-radius:6px; padding:14px; box-shadow:inset 0 0 40px rgba(120,0,0,.25);
    scroll-behavior:smooth;
  }
  .msg { margin:0 0 14px; max-width:92%; padding:10px 14px; border-radius:4px;
         border:1px solid var(--line); line-height:1.5; overflow-wrap:anywhere; }
  .msg.user { margin-left:auto; background:#220404; color:#ff9a9a; border-color:#7a0000; }
  .msg.bot { background:#150202; }
  .msg .who { font-size:.68rem; letter-spacing:.2em; color:var(--dim); margin-bottom:4px; }
  .msg p { margin:.4em 0; }
  .msg pre { background:#0b0000; border:1px solid var(--line); padding:10px;
             border-radius:4px; overflow-x:auto; position:relative; }
  .msg code { color:#ff8a8a; font-family:'Share Tech Mono',monospace; }
  .copy { position:absolute; top:6px; right:6px; font-size:.65rem; padding:2px 8px; }
  .cursor::after { content:"▋"; animation:blink 1s steps(2) infinite; color:var(--red); }
  @keyframes blink { 50% { opacity:0; } }
  form { display:flex; gap:8px; }
  textarea {
    flex:1; resize:none; height:56px; background:var(--panel); color:var(--red2);
    border:1px solid #7a0000; border-radius:6px; padding:10px 12px;
    font:inherit; outline:none;
  }
  textarea:focus { box-shadow:var(--glow); border-color:var(--red); }
  button {
    background:#2a0404; color:var(--red); border:1px solid var(--red); border-radius:6px;
    padding:0 18px; font:inherit; letter-spacing:.15em; cursor:pointer;
  }
  button:hover:not(:disabled) { background:#4a0606; box-shadow:var(--glow); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  details { border:1px solid var(--line); border-radius:6px; padding:8px 12px;
            background:var(--panel); font-size:.8rem; }
  summary { cursor:pointer; color:var(--dim); letter-spacing:.15em; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  label { color:var(--dim); font-size:.75rem; }
  input[type=text], input[type=password] {
    background:#0b0000; color:var(--red2); border:1px solid #7a0000; border-radius:4px;
    padding:6px 8px; font:inherit; min-width:260px;
  }
  input[type=range] { accent-color:var(--red); }
  .note { color:var(--dim); font-size:.7rem; margin-top:8px; line-height:1.4; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:#4a0000; }
</style>
</head>
<body>
<header>
  <div class="ring"></div>
  <h1>L.I.N.C.O.N.</h1>
  <div class="sub">LOGICAL INTELLIGENCE &amp; NEURAL COMMAND OPERATING NODE</div>
  <div id="status">LINK: <b id="link">STANDBY</b></div>
</header>

<main>
  <div id="log"></div>

  <details>
    <summary>SYSTEM</summary>
    <div class="row">
      <label>TEMPERATURE <input id="temp" type="range" min="0.1" max="1.5" step="0.05" value="0.6"> <span id="tempv">0.6</span></label>
      <label>MAX TOKENS <input id="maxtok" type="range" min="128" max="2048" step="128" value="1024"> <span id="maxv">1024</span></label>
    </div>
    <div class="row">
      <label>HF TOKEN (optional) <input id="token" type="password" placeholder="hf_..."></label>
      <button type="button" id="savetok" style="padding:6px 12px">SAVE</button>
      <button type="button" id="clear" style="padding:6px 12px">CLEAR CHAT</button>
    </div>
    <div class="note">
      Without a token, GPU time is shared and heavily limited. A token (stored only in this browser)
      makes requests use <i>your</i> Hugging Face GPU quota. Never share a token you don't want used.
    </div>
  </details>

  <form id="form">
    <textarea id="input" placeholder="Enter command... (Enter to send, Shift+Enter for newline)" autofocus></textarea>
    <button id="send" type="submit">SEND</button>
  </form>
</main>

<script type="module">
  import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

  // ====== CONFIG: set this to your Space ("username/space-name") ======
  const SPACE_ID = "CaelumNova/LINCOLN";
  // ====================================================================

  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), sendBtn = $("send"), linkEl = $("link");
  let history = [];
  let app = null;
  let busy = false;

  const getToken = () => { try { return localStorage.getItem("lincon_hf_token") || ""; } catch { return ""; } };

  function setLink(text) { linkEl.textContent = text; }

  async function connect() {
    setLink("CONNECTING...");
    try {
      const token = getToken();
      app = await Client.connect(SPACE_ID, token ? { hf_token: token } : {});
      setLink("ONLINE");
    } catch (e) {
      app = null;
      setLink("OFFLINE");
      addBot("**Link failure.** Could not reach the backend Space. It may be starting up or asleep; try again shortly.\n\n`" + (e?.message || e) + "`");
    }
  }

  function render(md) {
    return DOMPurify.sanitize(marked.parse(md || ""));
  }

  function decorate(el) {
    el.querySelectorAll("pre").forEach((pre) => {
      if (pre.querySelector(".copy")) return;
      const b = document.createElement("button");
      b.className = "copy"; b.type = "button"; b.textContent = "COPY";
      b.onclick = () => {
        navigator.clipboard.writeText(pre.innerText.replace(/COPY$/, "").trim());
        b.textContent = "COPIED"; setTimeout(() => (b.textContent = "COPY"), 1200);
      };
      pre.appendChild(b);
    });
  }

  function addMsg(role, md) {
    const d = document.createElement("div");
    d.className = "msg " + role;
    d.innerHTML = `<div class="who">${role === "user" ? "YOU" : "L.I.N.C.O.N."}</div><div class="body"></div>`;
    const body = d.querySelector(".body");
    if (role === "user") body.textContent = md; else { body.innerHTML = render(md); decorate(body); }
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return body;
  }
  const addBot = (md) => addMsg("bot", md);

  async function send(text) {
    if (busy || !text.trim()) return;
    if (!app) await connect();
    if (!app) return;

    busy = true; sendBtn.disabled = true;
    addMsg("user", text);
    const body = addBot("");
    body.classList.add("cursor");
    let reply = "";

    try {
      const job = app.submit("/chat", [
        text,
        JSON.stringify(history),
        parseFloat($("temp").value),
        parseInt($("maxtok").value, 10),
      ]);
      for await (const ev of job) {
        if (ev.type === "data" && ev.data && typeof ev.data[0] === "string") {
          reply = ev.data[0];
          body.innerHTML = render(reply); decorate(body);
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === "status") {
          if (ev.stage === "pending" && !reply) body.innerHTML = "<i>Acquiring GPU...</i>";
          if (ev.stage === "error") throw new Error(ev.message || "Backend error");
        }
      }
      history.push({ role: "user", content: text }, { role: "assistant", content: reply });
      history = history.slice(-32);
    } catch (e) {
      body.innerHTML = render("**Error:** " + (e?.message || e) +
        "\n\nIf this mentions quota, add your Hugging Face token under SYSTEM.");
    } finally {
      body.classList.remove("cursor");
      busy = false; sendBtn.disabled = false; input.focus();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault(); const t = input.value; input.value = ""; send(t);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("temp").oninput = (e) => ($("tempv").textContent = e.target.value);
  $("maxtok").oninput = (e) => ($("maxv").textContent = e.target.value);
  $("clear").onclick = () => { history = []; log.innerHTML = ""; greet(); };
  $("savetok").onclick = async () => {
    try { localStorage.setItem("lincon_hf_token", $("token").value.trim()); } catch {}
    $("token").value = ""; await connect();
  };

  function greet() { addBot("L.I.N.C.O.N. online. Standing by. How may I assist?"); }
  greet();
  connect();
</script>
</body>
</html>
